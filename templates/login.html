<!DOCTYPE html>
<html>
<head>
<title>Login - AI Traffic Detection</title>

<style>

body{
font-family: Arial;
background:#0B0F1A;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#1F2937;
padding:40px;
border-radius:10px;
width:350px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.5);
}

input{
width:90%;
padding:12px;
margin:10px;
border-radius:6px;
border:none;
}

button{
padding:12px 20px;
background:#3B82F6;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2563EB;
}

h2{
margin-bottom:20px;
}

.error{
color:red;
}

</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Security Dashboard Login</h2>

<form method="POST">

<input type="text" name="username" placeholder="Username" required><br>

<input type="password" name="password" placeholder="Password" required><br>

<button type="submit">Login</button>

</form>

{% if error %}
<p class="error">{{error}}</p>
{% endif %}

</div>

</body>
</html>
